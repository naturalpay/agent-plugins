name: pr-checks

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    name: Lint plugin manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Every JSON file parses
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! jq empty "$f"; then
              echo "::error file=$f::invalid JSON"
              status=1
            fi
          done < <(find . -name '*.json' -not -path './.git/*' -print0)
          exit "$status"

      - name: Each plugin has a manifest with a name and version
        run: |
          status=0
          for f in plugins/*/.claude-plugin/plugin.json; do
            if ! jq -e '.name and .version' "$f" > /dev/null; then
              echo "::error file=$f::plugin.json needs name and version"
              status=1
            fi
          done
          exit "$status"
